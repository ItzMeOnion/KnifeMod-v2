plugins {
    id 'fabric-loom' version '1.11-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    mods {
        "knifemod" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

// ---------------------------------------------------------------------------
// Knife catalogue. Every base is combined with every finish, so this makes
// bases.size() * finishes.size() knives. Edit these lists to add more.
// ---------------------------------------------------------------------------

// [base name, vanilla sprite it is drawn with]
def knifeBases = [
    ["Karambit", "minecraft:item/iron_sword"],
    ["Butterfly Knife", "minecraft:item/diamond_sword"],
    ["Bayonet", "minecraft:item/netherite_sword"],
    ["Flip Knife", "minecraft:item/golden_sword"],
    ["M9 Bayonet", "minecraft:item/stone_sword"],
    ["Talon Knife", "minecraft:item/trident"],
    ["Skeleton Knife", "minecraft:item/bone"],
    ["Huntsman Knife", "minecraft:item/wooden_sword"],
    ["Shadow Dagger", "minecraft:item/blaze_rod"],
    ["Kukri Knife", "minecraft:item/stick"],
]

// [finish name, tint RGB, rarity name (COMMON, UNCOMMON, RARE, EPIC, LEGENDARY)]
def knifeFinishes = [
    ["Vanilla", 0xFFFFFF, "COMMON"],
    ["Tiger Tooth", 0xFFB347, "UNCOMMON"],
    ["Fade", 0xFF8C00, "UNCOMMON"],
    ["Doppler", 0x7B68EE, "UNCOMMON"],
    ["Black Pearl", 0x3A3A4E, "RARE"],
    ["Lore", 0xFFAA33, "RARE"],
    ["Slaughter", 0xB22222, "RARE"],
    ["Crimson Web", 0xDC143C, "RARE"],
    ["Ruby", 0xE0115F, "EPIC"],
    ["Emerald", 0x50C878, "EPIC"],
    ["Sapphire", 0x0F52BA, "EPIC"],
    ["Void", 0x6A0DAD, "EPIC"],
    ["Gold", 0xFFD700, "LEGENDARY"],
    ["Marble Fade", 0xF5DEB3, "LEGENDARY"],
    ["Donut", 0xFF69B4, "LEGENDARY"],
    ["Diamond", 0x9EF0FF, "LEGENDARY"],
]

def snakeCase = { String s -> s.toLowerCase().replace(' ', '_') }

def knives = []
knifeBases.each { b ->
    knifeFinishes.each { f ->
        def shortBase = b[0].replace(' Knife', '').replace(' Dagger', '')
        def isVanilla = f[0] == 'Vanilla'
        def kid = isVanilla ? snakeCase(shortBase) : "${snakeCase(f[0])}_${snakeCase(shortBase)}"
        def kname = isVanilla ? b[0] : "${f[0]} ${b[0]}"
        knives << [id: kid, name: kname, base: b[0], finish: f[0], rarity: f[2], rgb: f[1], tex: b[1]]
    }
}

def ids = knives.collect { it.id }
if (ids.size() != ids.toSet().size()) {
    throw new GradleException("Duplicate knife ids generated")
}

// Generated code and assets go under build/, so the repo only holds the catalogue above.
def genRoot = layout.buildDirectory.dir("generated/knives").get().asFile

sourceSets {
    main {
        java.srcDir new File(genRoot, "java")
        resources.srcDir new File(genRoot, "resources")
    }
}

tasks.register("generateKnives") {
    outputs.dir(genRoot)
    doLast {
        genRoot.deleteDir()
        def javaDir = new File(genRoot, "java/com/knifemod")
        def assetDir = new File(genRoot, "resources/assets/knifemod")
        javaDir.mkdirs()
        new File(assetDir, "items").mkdirs()
        new File(assetDir, "models/item").mkdirs()
        new File(assetDir, "lang").mkdirs()

        // Java registry
        def java = [
            "package com.knifemod;",
            "",
            "import java.util.List;",
            "",
            "/** GENERATED by build.gradle. Do not edit. */",
            "public final class KnifeList {",
            "    public static final List<KnifeDef> ALL = List.of(",
        ]
        knives.eachWithIndex { k, i ->
            def comma = i < knives.size() - 1 ? "," : ""
            java << String.format('        new KnifeDef("%s", "%s", "%s", "%s", Rarity.%s, 0x%06X, "%s")%s',
                    k.id, k.name, k.base, k.finish, k.rarity, k.rgb, k.tex, comma)
        }
        java += ["    );", "", "    private KnifeList() {", "    }", "}", ""]
        new File(javaDir, "KnifeList.java").text = java.join("\n")

        def lang = new TreeMap<String, String>()
        knives.each { k ->
            lang["item.knifemod.${k.id}".toString()] = k.name

            // Item model: a generated sprite, so layer0 gets tintindex 0
            new File(assetDir, "models/item/${k.id}.json").text = """{
  "parent": "minecraft:item/generated",
  "textures": {
    "layer0": "${k.tex}"
  }
}
"""
            // Item definition: the tint colour for this finish
            long argb = 0xFF000000L | k.rgb
            int signed = (int) (argb >= (1L << 31) ? argb - (1L << 32) : argb)
            new File(assetDir, "items/${k.id}.json").text = """{
  "model": {
    "type": "minecraft:model",
    "model": "knifemod:item/${k.id}",
    "tints": [
      { "type": "minecraft:constant", "value": ${signed} }
    ]
  }
}
"""
        }
        lang["category.knifemod"] = "Knife Cases"
        lang["key.knifemod.open_menu"] = "Open case menu"
        lang["key.knifemod.spin"] = "Spin knife"
        lang["key.knifemod.inspect"] = "Inspect knife"
        new File(assetDir, "lang/en_us.json").text =
                groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(lang))
        logger.lifecycle("Generated ${knives.size()} knives")
    }
}

tasks.named("compileJava") { dependsOn "generateKnives" }
tasks.named("processResources") { dependsOn "generateKnives" }

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
tasks.named("sourcesJar") { dependsOn "generateKnives" }
